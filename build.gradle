plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'eclipse'
    id 'maven-publish'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

jarJar.enable()

version = '1.20.1-2.0.0'
group = 'com.weegeeday.peripheralsplusone'
archivesBaseName = 'PeripheralsPlusOne'

minecraft {
    mappings channel: 'official', version: '1.20.1'

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.logging.file.level', 'debug'
            mods {
                peripheralsplusone {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.logging.file.level', 'debug'
            mods {
                peripheralsplusone {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven {
        name = 'squiddev'
        url = 'https://maven.squiddev.cc'
        content {
            includeGroup 'cc.tweaked'
        }
    }
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.20'
    compileOnly 'cc.tweaked:cc-tweaked-1.20.1-core-api:1.114.2'
    compileOnly fg.deobf('cc.tweaked:cc-tweaked-1.20.1-forge-api:1.114.2')
    runtimeOnly fg.deobf('cc.tweaked:cc-tweaked-1.20.1-forge:1.114.2')
    jarJar(implementation('org.bouncycastle:bcprov-jdk18on:1.76')) {
        jarJar.ranged(it, '[1.76,2.0)')
    }
    jarJar(implementation('org.bouncycastle:bcpg-jdk18on:1.76')) {
        jarJar.ranged(it, '[1.76,2.0)')
    }
    jarJar(implementation('name.neuhalfen.projects.crypto.bouncycastle.openpgp:bouncy-gpg:2.3.0')) {
        jarJar.ranged(it, '[2.3.0,3.0)')
    }
}

jar {
    manifest {
        attributes([
            'Specification-Title'   : 'peripheralsplusone',
            'Specification-Vendor'  : 'weegeeday',
            'Specification-Version' : '1',
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor' : 'weegeeday',
        ])
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}
